name: Build SWV APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SWV ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Phone
            module: app
          - target: TV
            module: tv

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.module }}:assembleProdDebug \
            -Pbitchord.bundleWear=false --max-workers=2

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SWV-${{ matrix.target }}
          path: ${{ matrix.module }}/build/outputs/apk/prod/debug/*universal*.apk
          if-no-files-found: error
